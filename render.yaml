services:
  - type: worker
    name: miss-chutki
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MAX_THREADS
        value: "100"
      - key: MAX_DURATION
        value: "600"
    autoDeploy: false
